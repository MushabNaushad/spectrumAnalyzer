; ADS1115 X-Y "oscilloscope" for ESP32-WROOM
; One project, two firmwares:
;   pio run -e udp_web -t upload   -> streams samples over UDP (PC page: tools/scope_server.py)
;   pio run -e tft_st7796 -t upload  (or tft_ili9488) -> draws on the 3.5" 480x320 SPI TFT
; User settings live in include/config.h

[platformio]
default_envs = tft_st7796

; Arduino core 2.0.x (espressif32 6.x) - stable with TFT_eSPI.
; board esp32dev = generic ESP32-WROOM-32 DevKit.
[env]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D CORE_DEBUG_LEVEL=1

; ---------------- 1) Wi-Fi / UDP test build ----------------
[env:udp_web]
build_src_filter = +<main_udp.cpp>

; ---------------- 1b) I2C bus diagnostic (no display) ----------------
;   PROJECT TASKS -> i2c_diag -> Upload, then Monitor
[env:i2c_diag]
build_src_filter = +<main_diag.cpp>

; ---------------- 2) SPI TFT builds (3.5" 480x320, SPI header) ----------------
; TFT_eSPI is configured entirely by these flags (no User_Setup.h edits).
; Pins follow the PCB's LCD header X8:
;   X8.8 GND  X8.7 3V3  X8.6 GPIO18=SCL  X8.5 GPIO23=SDA  X8.4 GPIO4=RST
;   X8.3 GPIO27=DC  X8.2 GPIO5=CS  X8.1 GPIO25=BL   (display SDA-O not connected)
; Two builds, one per possible driver chip. Flash st7796 first; if the screen
; stays white or shows garbage, flash ili9488.
;   pio run -e tft_st7796  -t upload
;   pio run -e tft_ili9488 -t upload
[tft_common]
build_src_filter = +<main_tft.cpp>
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    ${env.build_flags}
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=-1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=27
    -D TFT_RST=4
    -D TFT_BL=25
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1

[env:tft_st7796]
extends = tft_common
build_flags =
    ${tft_common.build_flags}
    -D ST7796_DRIVER=1
    -D SPI_FREQUENCY=40000000

; ILI9488 over SPI uses 18-bit colour (3 bytes per pixel), so it is slower.
[env:tft_ili9488]
extends = tft_common
build_flags =
    ${tft_common.build_flags}
    -D ILI9488_DRIVER=1
    -D SPI_FREQUENCY=27000000

; Same diagnostic, but with the display library initialised first (tft_st7796 settings).
; If this fails while i2c_diag works, the display code is what breaks I2C.
[env:i2c_diag_tft]
extends = env:tft_st7796
build_src_filter = +<main_diag.cpp>
build_flags =
    ${env:tft_st7796.build_flags}
    -D DIAG_WITH_TFT=1

